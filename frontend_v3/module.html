<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>牧融绿链 - 模块详情</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="module">
    <div id="app">
      <div v-if="loading" class="loading">
        <span></span>
        <strong>模块数据加载中</strong>
      </div>

      <main v-else class="page-shell">
        <header class="site-header">
          <div class="brand-mark">
            <b>牧融绿链</b>
            <span>工行风控模块详情</span>
          </div>
          <nav class="top-nav">
            <a href="./index.html">首页</a>
            <a href="./modules.html">返回模块页</a>
            <a href="./overview.html">工行总览</a>
            <a href="./data.html">工行数据底账</a>
          </nav>
        </header>

        <section class="detail-layout">
          <article class="detail-card detail-hero">
            <span class="detail-badge">{{ currentModule.code }}</span>
            <h1>{{ currentModule.name }}</h1>
            <p>{{ currentModule.value }}</p>
            <ul class="feature-list">
              <li v-for="feature in currentModule.features" :key="feature">{{ feature }}</li>
            </ul>
            <div class="nav-links">
              <a class="page-link" :href="moduleHref(prevModule.code)">上一模块</a>
              <a class="page-link" :href="moduleHref(nextModule.code)">下一模块</a>
            </div>
          </article>

          <article class="detail-card">
            <span class="section-subtitle">Related Views</span>
            <h3>关联模块</h3>
            <div class="card-list">
              <a v-for="module in relatedModules" :key="module.code" class="link-card module-card" :href="moduleHref(module.code)">
                <small>{{ module.code }}</small>
                <h3>{{ module.name }}</h3>
                <p>{{ module.value }}</p>
              </a>
            </div>
          </article>
        </section>
      </main>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
