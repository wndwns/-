name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall backend
      - name: Truthfulness regression
        run: python backend/test_truthful_outputs.py
      - name: Credit decision regression
        run: python backend/test_credit_decision.py
      - name: Credit decision extended regression
        run: python backend/test_credit_decision_extended.py
      - name: Live-stock pledge & bottleneck regression
        run: python backend/test_credit_decision_pledge.py
      - name: Bank view API regression
        run: python backend/test_bank_api.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend syntax check
        run: node --check frontend/app.js
      - name: Bank console syntax check
        run: node --check frontend/bank.js