        <div class="section-heading">
          <span>实施路线</span>
          <h1>从风险识别到绿色金融闭环</h1>
          <p>围绕客户经理的授信、核验和贷后工作，逐步补齐数据与协同能力。</p>
        </div>
        <div class="module-grid modules-page-grid">
          <article class="module-card">
            <small>01</small>
            <h3>数据与证据</h3>
            <p>整理气象、遥感、草场、经营、授信和保险资料，明确公开观测、派生测算、演示样例和待人工核验边界。</p>
          </article>
          <article class="module-card">
            <small>02</small>
            <h3>授信与贷后</h3>
            <p>围绕资金需求、偿债支持和授信约束形成唯一建议金额，并保留月度现金流和贷后核查依据。</p>
          </article>
          <article class="module-card">
            <small>03</small>
            <h3>风险核查</h3>
            <p>将县域风险、主体经营和灾害线索整理为人工核查优先级，不替代客户经理和审批人员判断。</p>
          </article>
          <article class="module-card">
            <small>04</small>
            <h3>银保协同</h3>
            <p>补充保单、查勘、理赔和资金用途资料，让风险缓释和贷后动作形成可追踪闭环。</p>
          </article>
